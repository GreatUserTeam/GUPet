[package]
name = "gupet"
version = "3.0.0"
description = "GUPet — a pixel pet that lives on your desktop"
authors = ["GUTeam"]
license = "MIT"
repository = "https://github.com/GreatUserTeam/GUPet"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
mpris = "2.1"
dirs = "6"
rand = "0.9"
x11 = { version = "2.21", features = ["xlib"] }
raw-window-handle = "0.6"
ureq = { version = "2.12", features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
