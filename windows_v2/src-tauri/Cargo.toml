[package]
name = "gupet"
version = "3.0.0"
description = "GUPet — a pixel pet that lives on your desktop"
authors = ["GUTeam"]
license = "MIT"
repository = "https://github.com/GreatUserTeam/GUPet"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
dirs = "6"
rand = "0.9"
raw-window-handle = "0.6"
ureq = { version = "2.12", features = ["json"] }

# Windows-only APIs. Keeping them behind cfg(windows) means the project can
# still be syntax-checked on a non-Windows host without pulling in Win32.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "ApplicationModel",
  "Data_Xml_Dom",
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "UI_Notifications",
  "UI_Notifications_Management",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
