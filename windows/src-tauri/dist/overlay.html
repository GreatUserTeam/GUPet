<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GUPet Overlay</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
    }
    #root {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      background: transparent;
    }
    .pet {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: auto;
      touch-action: none;
      cursor: grab;
      will-change: transform;
      z-index: 20;
    }
    .pet.dragging { cursor: grabbing; }
    .pet canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent;
    }
    .poop {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: auto;
      cursor: pointer;
      z-index: 15;
      transform: scale(0.1);
      transform-origin: 50% 80%;
      transition: transform 320ms cubic-bezier(.2, 1.35, .4, 1), opacity 500ms ease, rotate 500ms ease;
      will-change: transform, opacity;
    }
    .poop.removing {
      transform: scale(0.05) rotate(90deg) !important;
      opacity: 0;
    }
    .bubble {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
      z-index: 40;
      box-sizing: border-box;
      max-width: 260px;
      white-space: normal;
      overflow-wrap: break-word;
      word-break: break-word;
      text-align: center;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      font-weight: 600;
      line-height: 1.25;
      border-radius: 14px;
      padding: 6px 10px;
      opacity: 0;
      display: none;
      will-change: opacity, transform;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .22);
    }
    #fatal {
      position: fixed;
      left: 12px;
      top: 12px;
      z-index: 100;
      display: none;
      max-width: min(640px, calc(100vw - 24px));
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(24, 12, 12, .92);
      border: 1px solid #ff4d30;
      color: #ffe8e2;
      font: 13px/1.4 system-ui, sans-serif;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="fatal"></div>
  <script src="overlay.js"></script>
</body>
</html>
